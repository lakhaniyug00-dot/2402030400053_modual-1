<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Registration Form</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================
           GLOBAL STYLING
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 750px;
        }

        /* =========================
           FORM DESIGN
        ========================= */

        .registration-form {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            color: white;
            animation: fadeIn 1s ease;
        }

        /* =========================
           FORM TITLE
        ========================= */

        .registration-form h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
        }

        /* =========================
           INPUT BOX
        ========================= */

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* =========================
           INPUT FIELD
        ========================= */

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #666;
        }

        /* =========================
           INPUTS
        ========================= */

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        textarea {
            padding-left: 15px;
            resize: none;
        }

        /* =========================
           FOCUS EFFECT
        ========================= */

        input:focus,
        select:focus,
        textarea:focus {
            transform: scale(1.02);
            box-shadow: 0 0 10px #fff;
        }

        /* =========================
           RADIO BUTTONS & CHECKBOX
        ========================= */

        .gender-box,
        .hobby-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gender-box label,
        .hobby-box label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================
           FILE INPUT
        ========================= */

        input[type="file"] {
            background: white;
            color: black;
            padding: 12px;
            cursor: pointer;
        }

        /* =========================
           BUTTONS
        ========================= */

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
            font-weight: 600;
        }

        /* Submit Button */

        .submit-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.5);
        }

        /* Reset Button */

        .reset-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 75, 43, 0.5);
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media (max-width: 768px) {

            .registration-form {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            .gender-box,
            .hobby-box {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <form class="registration-form">

            <h2>
                <i class="fa-solid fa-user-plus"></i>
                Registration Form
            </h2>

            <!-- Full Name -->

            <div class="input-box">
                <label for="fullname">Full Name</label>

                <div class="input-field">
                    <i class="fa-solid fa-user"></i>

                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="3"
                        required>
                </div>
            </div>

            <!-- Age -->

            <div class="input-box">
                <label for="age">Age</label>

                <div class="input-field">
                    <i class="fa-solid fa-calendar"></i>

                    <input type="number" id="age" name="age" placeholder="Enter your age" min="18" max="100" required>
                </div>
            </div>

            <!-- Email -->

            <div class="input-box">
                <label for="email">Email Address</label>

                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <!-- Mobile Number -->

            <div class="input-box">
                <label for="mobile">Mobile Number</label>

                <div class="input-field">
                    <i class="fa-solid fa-phone"></i>

                    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}"
                        maxlength="10" required>
                </div>
            </div>

            <!-- Gender -->

            <div class="input-box">
                <label>Gender</label>

                <div class="gender-box">

                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>

                </div>
            </div>

            <!-- Hobbies -->

            <div class="input-box">
                <label>Hobbies</label>

                <div class="hobby-box">

                    <label>
                        <input type="checkbox" name="hobbies" value="Reading">
                        Reading
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Coding">
                        Coding
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Gaming">
                        Gaming
                    </label>

                </div>
            </div>

            <!-- City -->

            <div class="input-box">
                <label for="city">City</label>

                <select id="city" name="city" required>
                    <option value="">Select City</option>
                    <option>Ahmedabad</option>
                    <option>Surat</option>
                    <option>Vadodara</option>
                    <option>Rajkot</option>
                </select>
            </div>

            <!-- Address -->

            <div class="input-box">
                <label for="address">Address</label>

                <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>
            </div>

            <!-- State -->

            <div class="input-box">
                <label for="state">State</label>

                <select id="state" name="state" required>
                    <option value="">Select State</option>
                    <option>Gujarat</option>
                    <option>Maharashtra</option>
                    <option>Rajasthan</option>
                    <option>Delhi</option>
                </select>
            </div>

            <!-- Birthday -->

            <div class="input-box">
                <label for="birthday">Birthday</label>

                <div class="input-field">
                    <i class="fa-solid fa-cake-candles"></i>

                    <input type="date" id="birthday" name="birthday" required>
                </div>
            </div>

            <!-- Password -->

            <div class="input-box">
                <label for="password">Password</label>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="password" name="password" placeholder="Enter password" minlength="6"
                        required>
                </div>
            </div>

            <!-- Confirm Password -->

            <div class="input-box">
                <label for="confirmPassword">Confirm Password</label>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"
                        minlength="6" required>
                </div>
            </div>

            <!-- Upload Photo -->

            <div class="input-box">
                <label>Upload Profile Photo</label>

                <input type="file" accept="image/*">
            </div>

            <!-- Upload PDF -->

            <div class="input-box">
                <label>Upload PDF Document</label>

                <input type="file" accept=".pdf">
            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit
                </button>

                <button type="reset" class="reset-btn">
                    <i class="fa-solid fa-rotate"></i>
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>

</html>
